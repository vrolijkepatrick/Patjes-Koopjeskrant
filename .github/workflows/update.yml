name: Vernieuw aanbiedingen
on:
  workflow_dispatch:
  schedule:
    # 07:00 UTC op zondag en woensdag (08:00 wintertijd / 09:00 zomertijd NL)
    - cron: '0 7 * * 0,3'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Haal aanbiedingen op
        run: python update.py
      - name: Bewaar nieuwe gegevens
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/aanbiedingen.json
          if ! git diff --cached --quiet; then git commit -m 'Ververs aanbiedingen'; git push; fi
